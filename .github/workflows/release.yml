name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04-arm
    env:
      NPM_CONFIG_FETCH_RETRIES: '5'
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false

      - name: Publish release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if npx changelogithub; then
              exit 0
            fi
            echo "::warning::changelogithub failed on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "::error::changelogithub failed after 3 attempts"
          exit 1

      - run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Pack portable release archive
        run: node scripts/pack-preview.mjs "$RUNNER_TEMP/nuxt-ai-ready.tgz"

      - name: Check packed manifest
        run: node scripts/check-pack-manifest.mjs "$RUNNER_TEMP/nuxt-ai-ready.tgz"

      - name: Detect prerelease tag
        id: prerelease
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -(beta|rc|alpha) ]]; then
            DIST_TAG=$(echo "$TAG" | sed 's/.*-\(beta\|rc\|alpha\).*/\1/')
            echo "tag=--tag $DIST_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm publish "$RUNNER_TEMP/nuxt-ai-ready.tgz" --access public --no-git-checks --provenance ${{ steps.prerelease.outputs.tag }}
