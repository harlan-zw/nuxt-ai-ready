name: Nightly

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '!**'

permissions:
  contents: read

jobs:
  build:
    uses: harlan-zw/nuxt-seo/.github/workflows/reusable-nightly.yml@main
    with:
      # pkg-pr-new otherwise defaults to npm pack, which cannot resolve pnpm
      # catalog dependency specifiers in preview tarballs.
      publish-packages: --pnpm
