name: Nightly

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '!**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - name: Prepare pinned migration sources
        id: migration
        uses: harlan-zw/nuxt-seo/.github/actions/migration-ci@226c091a0744b7286ef721ac035eed53856bfaa5
      - run: pnpm dev:prepare
        working-directory: ${{ steps.migration.outputs.workspace }}
      - name: Pack portable beta preview
        run: node scripts/pack-preview.mjs "$RUNNER_TEMP/nuxt-ai-ready.tgz"
        working-directory: ${{ steps.migration.outputs.workspace }}
      - name: Check packed manifest
        run: node scripts/check-pack-manifest.mjs "$RUNNER_TEMP/nuxt-ai-ready.tgz"
        working-directory: ${{ steps.migration.outputs.workspace }}
      - name: Publish immutable preview
        run: pnpm dlx pkg-pr-new publish "$RUNNER_TEMP/nuxt-ai-ready.tgz"
        working-directory: ${{ steps.migration.outputs.workspace }}
