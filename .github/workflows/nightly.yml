name: Nightly

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '!**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm dev:prepare
      - name: Pack portable beta preview
        run: node scripts/pack-preview.mjs "$RUNNER_TEMP/nuxt-ai-ready.tgz"
      - name: Publish immutable preview
        run: pnpm dlx pkg-pr-new publish --prepacked "$RUNNER_TEMP/nuxt-ai-ready.tgz"
